name: E2E · Playwright

on:
  push:
    branches: [main]
    paths: ["e2e-playwright/**", ".github/workflows/e2e-playwright.yml"]
  pull_request:
    paths: ["e2e-playwright/**", ".github/workflows/e2e-playwright.yml"]
  schedule:
    - cron: "0 11 * * 1"        # lunes: detecta cambios en el sitio bajo prueba
  workflow_dispatch:

defaults:
  run:
    working-directory: e2e-playwright

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e-playwright/package-lock.json

      - run: npm ci

      - name: Instalar navegadores
        run: npx playwright install --with-deps chromium firefox

      - name: Correr pruebas
        run: npx playwright test

      - name: Publicar reporte
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e-playwright/playwright-report/
          retention-days: 14
